<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Persian Silver</title>
  <meta name="description" content="Persian Silver" />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/AmirAbbasVafaee/persian-fonts-cdn@main/css/peyda.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              beige: '#E2D5C3',
              cream: '#F5EEE4',
              bronze: '#8B6F4E',
              gold: '#B69D7D',
              dark: '#5C4835',
              ink: '#1C1814',
              slate: '#3D4F4E',
            },
          },
          fontFamily: { peyda: ['Peyda', 'Tahoma', 'sans-serif'] },
        },
      },
    };
  </script>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: 'Peyda', Tahoma, sans-serif;
      background-color: #E2D5C3;
      min-height: 100dvh;
    }

    .paper-texture {
      background-color: #E2D5C3;
      background-image:
        radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.45) 0%, transparent 50%),
        radial-gradient(ellipse at 100% 60%, rgba(61,79,78,.07) 0%, transparent 42%),
        radial-gradient(ellipse at 0% 100%, rgba(139,111,78,.1) 0%, transparent 45%);
    }

    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding:
        max(2.75rem, calc(var(--safe-top) + 2rem))
        1.35rem
        max(2.75rem, calc(var(--safe-bottom) + 2rem));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity .28s cubic-bezier(.22,1,.36,1), transform .28s cubic-bezier(.22,1,.36,1), visibility .28s;
    }

    @media (min-width: 640px) {
      .view {
        justify-content: center;
        padding:
          max(2rem, calc(var(--safe-top) + 1.5rem))
          1.75rem
          max(2rem, calc(var(--safe-bottom) + 1.5rem));
      }
    }

    .view.is-active { opacity: 1; visibility: visible; pointer-events: auto; transform: translateY(0); }
    .view.is-leaving { opacity: 0; transform: translateY(-8px); }

    .view-inner {
      width: 100%;
      max-width: 24rem;
      margin-top: auto;
      margin-bottom: auto;
    }

    .nav-link { opacity: 0; }
    .home-ready .nav-link:nth-child(1) { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) .12s forwards; }
    .home-ready .nav-link:nth-child(2) { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) .2s forwards; }
    .home-ready .nav-link:nth-child(3) { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) .28s forwards; }
    .logo-wrap { opacity: 0; }
    .home-ready .logo-wrap { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) forwards; }
    .home-ready .home-panel { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) .08s both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .detail-in { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) forwards; }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      text-align: center;
      padding: 1rem 1.25rem;
      border-radius: 0.9rem;
      background: rgba(255, 255, 255, 0.55);
      color: #1C1814;
      font-weight: 500;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      border: 1px solid rgba(61, 79, 78, 0.15);
      box-shadow: none;
      transition: background .25s ease, color .25s ease, transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .nav-btn:hover,
    .nav-btn:focus-visible {
      background: #1C1814;
      color: #F5EEE4;
      border-color: #1C1814;
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(28, 24, 20, 0.16);
      outline: none;
    }
    .nav-btn:active { transform: translateY(0); }

    .logo-frame {
      border-radius: 1.1rem;
      overflow: hidden;
      border: 1px solid rgba(61, 79, 78, 0.14);
      box-shadow: none;
      background: #F5EEE4;
    }

    .contact-card {
      backdrop-filter: blur(10px);
      background: rgba(245, 238, 228, 0.88);
      border: 1px solid rgba(61, 79, 78, 0.18);
      border-radius: 1.35rem;
      box-shadow: 0 16px 40px rgba(28, 24, 20, 0.08);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      background: rgba(28, 24, 20, 0.06);
      color: #3D4F4E;
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid rgba(61, 79, 78, 0.18);
      transition: background .2s ease, color .2s ease;
    }
    .back-btn:hover { background: #1C1814; color: #F5EEE4; }

    .accent-line {
      width: 2.5rem;
      height: 2px;
      margin: 0.75rem auto 0;
      background: linear-gradient(90deg, transparent, #3D4F4E, transparent);
      border-radius: 999px;
    }

    .title-mark {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 7.5rem;
      padding: 1.75rem 1rem;
    }
    .title-mark__emblem {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 11rem;
      height: auto;
      opacity: 0.24;
      pointer-events: none;
      user-select: none;
    }
    .title-mark__text {
      position: relative;
      z-index: 1;
      max-width: 16rem;
      line-height: 1.45;
    }

    .music-toggle {
      position: fixed;
      left: max(1rem, env(safe-area-inset-left));
      bottom: max(1rem, env(safe-area-inset-bottom));
      z-index: 50;
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 999px;
      border: 1px solid rgba(28, 24, 20, 0.35);
      background: #1C1814;
      color: #F5EEE4;
      box-shadow: 0 8px 24px rgba(28, 24, 20, 0.22);
      display: none;
      align-items: center;
      justify-content: center;
      transition: opacity .2s ease, transform .2s ease;
    }
    .music-toggle.is-ready { display: inline-flex; }
    .music-toggle:hover { opacity: 0.88; }
    .music-toggle svg { width: 1.15rem; height: 1.15rem; display: none; }
    .music-toggle:not(.is-muted) .icon-on { display: block; }
    .music-toggle.is-muted .icon-off { display: block; }

    .enter-gate {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(255,255,255,.35) 0%, transparent 55%),
        #E2D5C3;
      cursor: pointer;
      transition: opacity .45s ease, visibility .45s ease;
    }
    .enter-gate.is-gone {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .enter-gate__card {
      width: min(100%, 20rem);
      text-align: center;
      padding: 1.75rem 1.5rem 1.5rem;
      border-radius: 1.35rem;
      background: rgba(245, 238, 228, 0.92);
      border: 1px solid rgba(61, 79, 78, 0.18);
      box-shadow: 0 18px 48px rgba(28, 24, 20, 0.12);
    }
    .enter-gate__emblem {
      width: 5.5rem;
      height: auto;
      margin: 0 auto 1rem;
      opacity: 0.9;
    }
    .enter-gate__title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1C1814;
      margin-bottom: 0.35rem;
    }
    .enter-gate__hint {
      font-size: 0.9rem;
      color: #3D4F4E;
      margin-bottom: 1.25rem;
    }
    .enter-gate__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.9rem 1rem;
      border-radius: 0.9rem;
      background: #1C1814;
      color: #F5EEE4;
      font-weight: 500;
      font-size: 1rem;
      border: none;
    }
  </style>
</head>
<body class="paper-texture text-brand-dark antialiased overflow-x-hidden font-peyda">
  <audio id="bg-music" src="assets/bg-music.mp3" loop preload="auto" playsinline></audio>

  <div id="enter-gate" class="enter-gate" role="dialog" aria-modal="true">
    <div class="enter-gate__card">
      <img src="assets/emblem.png" alt="" class="enter-gate__emblem" />
      <div class="enter-gate__title">Persian Silver</div>
      <div class="enter-gate__hint" id="enter-hint"></div>
      <button type="button" class="enter-gate__btn" id="enter-btn"></button>
    </div>
  </div>

  <button type="button" id="music-toggle" class="music-toggle is-muted" aria-label="Music" title="Music">
    <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
    <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
      <path d="M4 4l16 16"/>
    </svg>
  </button>
  <div id="app" class="relative min-h-[100dvh] w-full max-w-lg mx-auto">
    <section id="view-home" class="view is-active" data-aria="homeAria">
      <div class="view-inner">
        <div class="logo-wrap w-full max-w-[16rem] sm:max-w-[18rem] mx-auto mb-6">
          <div class="logo-frame">
            <img src="logo.jpg" alt="Persian Silver" class="w-full h-auto block" width="340" height="454" fetchpriority="high" />
          </div>
          <div class="accent-line mt-5" aria-hidden="true"></div>
        </div>
        <div class="home-panel contact-card p-4 sm:p-5 space-y-3 opacity-0">
          <nav class="w-full flex flex-col gap-2.5" data-aria="navAria">
            <a href="#retail" data-nav="retail" data-text="retail" class="nav-link nav-btn"></a>
            <a href="#wholesale" data-nav="wholesale" data-text="wholesale" class="nav-link nav-btn"></a>
            <a href="#trade" data-nav="trade" data-text="trade" class="nav-link nav-btn"></a>
          </nav>
        </div>
      </div>
    </section>

    <section id="view-retail" class="view" hidden>
      <div class="view-inner detail-in">
        <button type="button" data-back class="back-btn mb-7"><span aria-hidden="true">&#8594;</span> <span data-text="back"></span></button>
        <header class="text-center mb-7">
          <div class="title-mark">
            <img src="assets/emblem.png" alt="" class="title-mark__emblem" />
            <h1 class="title-mark__text text-2xl font-bold text-brand-ink tracking-tight" data-page-title></h1>
          </div>
          <div class="accent-line" aria-hidden="true"></div>
        </header>
        <div class="contact-card space-y-5 p-6" data-contact="retail"></div>
      </div>
    </section>

    <section id="view-wholesale" class="view" hidden>
      <div class="view-inner detail-in">
        <button type="button" data-back class="back-btn mb-7"><span aria-hidden="true">&#8594;</span> <span data-text="back"></span></button>
        <header class="text-center mb-7">
          <div class="title-mark">
            <img src="assets/emblem.png" alt="" class="title-mark__emblem" />
            <h1 class="title-mark__text text-2xl font-bold text-brand-ink tracking-tight" data-page-title></h1>
          </div>
          <div class="accent-line" aria-hidden="true"></div>
        </header>
        <div class="contact-card space-y-5 p-6" data-contact="wholesale"></div>
      </div>
    </section>

    <section id="view-trade" class="view" hidden>
      <div class="view-inner detail-in">
        <button type="button" data-back class="back-btn mb-7"><span aria-hidden="true">&#8594;</span> <span data-text="back"></span></button>
        <header class="text-center mb-7">
          <div class="title-mark">
            <img src="assets/emblem.png" alt="" class="title-mark__emblem" />
            <h1 class="title-mark__text text-2xl font-bold text-brand-ink tracking-tight" data-page-title></h1>
          </div>
          <div class="accent-line" aria-hidden="true"></div>
        </header>
        <div class="contact-card space-y-5 p-6" data-contact="trade"></div>
      </div>
    </section>
  </div>
  <script src="assets/site-content.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
